<div id="ch-tab-main">
    <!-- 1. 核心设置 -->
    <div class="st-chatu8-settings-section st-chatu8-collapsible-section" data-section-id="main_core">
        <div class="st-chatu8-section-header">
            <h3><i class="fa-solid fa-sliders"></i> 核心设置</h3>
            <span class="st-chatu8-section-toggle"><i class="fa-solid fa-chevron-down st-chatu8-section-toggle-icon"></i></span>
        </div>
        <div class="st-chatu8-section-body">
        <div class="st-chatu8-field">
            <label for="scriptEnabled">启用插件</label>
            <div class="st-chatu8-toggle">
                <input id="scriptEnabled" type="checkbox" />
                <span class="st-chatu8-slider"></span>
            </div>
        </div>
        <div class="st-chatu8-field">
            <label for="helpTipsEnabled">设置项答疑提示</label>
            <div class="st-chatu8-toggle">
                <input id="helpTipsEnabled" type="checkbox" />
                <span class="st-chatu8-slider"></span>
            </div>
        </div>
        <div class="st-chatu8-field">
            <label for="disablePluginToast">插件提示关闭</label>
            <div class="st-chatu8-toggle">
                <input id="disablePluginToast" type="checkbox" />
                <span class="st-chatu8-slider"></span>
            </div>
        </div>
        <div class="st-chatu8-field">
            <label for="mode">模式</label>
            <select id="mode" class="st-chatu8-select">
                <option value="sd">SD</option>
                <option value="novelai">NovelAI</option>
                <option value="comfyui">ComfyUI</option>
                <option value="runninghub">RunningHub</option>
                <option value="banana">Banana/Grok</option>
            </select>
        </div>
        <div class="st-chatu8-field">
            <label for="client">客户端</label>
            <select id="client" class="st-chatu8-select">
                <option value="browser">浏览器</option>
                <option value="jiuguan">酒馆</option>
            </select>
        </div>
        <div class="st-chatu8-field">
            <label for="videoChannel">视频渠道选择</label>
            <select id="videoChannel" class="st-chatu8-select">
                <option value="none">无</option>
                <option value="comfyui">ComfyUI</option>
                <option value="runninghub">RunningHub</option>
            </select>
        </div>
        <!-- 自定义：智绘姬助手（点头像防误触 + 手动打开） -->
        <div class="st-chatu8-field">
            <label for="aiAssistantClickOpen">点头像打开助手</label>
            <div class="st-chatu8-toggle">
                <input id="aiAssistantClickOpen" type="checkbox" />
                <span class="st-chatu8-slider"></span>
            </div>
        </div>
        <p style="font-size: 12px; color: var(--st-chatu8-text-secondary); margin-top: 4px;">
            关闭后，点击左上角智绘姬头像将不再弹出助手（防误触）。仍可用右侧按钮手动打开。
        </p>
        <div class="st-chatu8-field">
            <label>手动打开助手</label>
            <button type="button" id="openAiAssistantBtn" class="st-chatu8-btn" style="padding:6px 14px;"><i class="fa-solid fa-robot"></i> 打开助手</button>
        </div>
        </div>
    </div>
    <!-- 2. 自动化与生成控制 -->
    <div class="st-chatu8-settings-section st-chatu8-collapsible-section" data-section-id="main_auto">
        <div class="st-chatu8-section-header">
            <h3><i class="fa-solid fa-bolt"></i> 自动化与生成控制</h3>
            <span class="st-chatu8-section-toggle"><i class="fa-solid fa-chevron-down st-chatu8-section-toggle-icon"></i></span>
        </div>
        <div class="st-chatu8-section-body">
        <div class="st-chatu8-field">
            <label for="imageGenInterval">生图间隔时间（毫秒）</label>
            <input type="number" id="imageGenInterval" class="st-chatu8-text-input" min="0" step="100" placeholder="0">
        </div>
        <div class="st-chatu8-field">
            <label for="enablePregen">启用流式预生成</label>
            <div class="st-chatu8-toggle">
                <input id="enablePregen" type="checkbox" />
                <span class="st-chatu8-slider"></span>
            </div>
        </div>
        <div class="st-chatu8-field">
            <label for="autoLLMImageGen">自动LLM请求生图(非同层)</label>
            <div class="st-chatu8-toggle">
                <input id="autoLLMImageGen" type="checkbox" />
                <span class="st-chatu8-slider"></span>
            </div>
        </div>
        <div class="st-chatu8-field">
            <label for="zidongdianji">自动点击生成</label>
            <div class="st-chatu8-toggle">
                <input id="zidongdianji" type="checkbox" />
                <span class="st-chatu8-slider"></span>
            </div>
        </div>
        <div class="st-chatu8-field">
            <label for="zidongdianji2">自动点击(没事别开)</label>
            <div class="st-chatu8-toggle">
                <input id="zidongdianji2" type="checkbox" />
                <span class="st-chatu8-slider"></span>
            </div>
        </div>
        <div class="st-chatu8-field">
            <label for="aiAutonomousResolution">AI自主分辨率</label>
            <div class="st-chatu8-toggle">
                <input id="aiAutonomousResolution" type="checkbox" />
                <span class="st-chatu8-slider"></span>
            </div>
        </div>
        <div class="st-chatu8-field">
            <label for="randomYushe">随机提示词预设</label>
            <div class="st-chatu8-toggle">
                <input id="randomYushe" type="checkbox" />
                <span class="st-chatu8-slider"></span>
            </div>
        </div>
        <div class="st-chatu8-field">
            <label for="newlineFixEnabled">换行修复</label>
            <div class="st-chatu8-toggle">
                <input id="newlineFixEnabled" type="checkbox" />
                <span class="st-chatu8-slider"></span>
            </div>
        </div>
        </div>
    </div>

    <!-- 3. 图片交互与显示 -->
    <div class="st-chatu8-settings-section st-chatu8-collapsible-section" data-section-id="main_image">
        <div class="st-chatu8-section-header">
            <h3><i class="fa-solid fa-image"></i> 图片交互与显示</h3>
            <span class="st-chatu8-section-toggle"><i class="fa-solid fa-chevron-down st-chatu8-section-toggle-icon"></i></span>
        </div>
        <div class="st-chatu8-section-body">
        <div class="st-chatu8-field">
            <label for="imageAlignment">图片对齐方式</label>
            <select id="imageAlignment" class="st-chatu8-select">
                <option value="left">靠左</option>
                <option value="center">居中</option>
                <option value="right">靠右</option>
            </select>
        </div>
        <div class="st-chatu8-field">
            <label for="imageSizeScale">图片显示大小</label>
            <select id="imageSizeScale" class="st-chatu8-select">
                <option value="100">自适应（100%）</option>
                <option value="75">3/4 大小（75%）</option>
                <option value="50">1/2 大小（50%）</option>
                <option value="25">1/4 大小（25%）</option>
            </select>
        </div>
        <div class="st-chatu8-field">
            <label for="collapseImage">折叠图片</label>
            <div class="st-chatu8-toggle">
                <input id="collapseImage" type="checkbox" />
                <span class="st-chatu8-slider"></span>
            </div>
        </div>
        <div class="st-chatu8-field">
            <label for="clickToPreview">单击图片预览</label>
            <div class="st-chatu8-toggle">
                <input id="clickToPreview" type="checkbox" />
                <span class="st-chatu8-slider"></span>
            </div>
        </div>
        <div class="st-chatu8-field">
            <label for="longPressToEdit">长按图片修改tag</label>
            <div class="st-chatu8-toggle">
                <input id="longPressToEdit" type="checkbox" />
                <span class="st-chatu8-slider"></span>
            </div>
        </div>
        <div class="st-chatu8-field">
            <label for="dbclike">隐藏按钮（双击图片触发）</label>
            <div class="st-chatu8-toggle">
                <input id="dbclike" type="checkbox" />
                <span class="st-chatu8-slider"></span>
            </div>
        </div>
        <!-- 自定义：隐藏角色特征中的 lora 调用 -->
        <div class="st-chatu8-field">
            <label for="hideCharacterLoraTags">隐藏角色特征中的 lora 调用 &lt;...&gt;</label>
            <div class="st-chatu8-toggle">
                <input id="hideCharacterLoraTags" type="checkbox" />
                <span class="st-chatu8-slider"></span>
            </div>
        </div>
        <p style="font-size: 12px; color: var(--st-chatu8-text-secondary); margin-top: 4px;">
            开启后，当调用多角色变量（$角色名$ 等）时，角色特征里尖括号内包含 lora 调用的片段（如 &lt;lora:xxx:0.8&gt;）会被隐藏，只把普通描述词送入生图。默认开启
        </p>
        </div>
    </div>
    <!-- 4. 提示词标记与储存 -->
    <div class="st-chatu8-settings-section st-chatu8-collapsible-section" data-section-id="main_prompt_tags">
        <div class="st-chatu8-section-header">
            <h3><i class="fa-solid fa-tags"></i> 提示词标记与储存</h3>
            <span class="st-chatu8-section-toggle"><i class="fa-solid fa-chevron-down st-chatu8-section-toggle-icon"></i></span>
        </div>
        <div class="st-chatu8-section-body">
        <div class="st-chatu8-field">
            <label for="startTag">开始标记</label>
            <input type="text" id="startTag" class="st-chatu8-text-input">
        </div>
        <div class="st-chatu8-field">
            <label for="endTag">结束标记</label>
            <input type="text" id="endTag" class="st-chatu8-text-input">
        </div>
        <div class="st-chatu8-field">
            <label for="insertOriginalText">插入原文(非同层)</label>
            <div class="st-chatu8-toggle">
                <input id="insertOriginalText" type="checkbox" />
                <span class="st-chatu8-slider"></span>
            </div>
        </div>
        </div>
    </div>
    <!-- 5. 存储与缓存管理 -->
    <div class="st-chatu8-settings-section st-chatu8-collapsible-section" data-section-id="main_storage">
        <div class="st-chatu8-section-header">
            <h3><i class="fa-solid fa-database"></i> 存储与缓存管理</h3>
            <span class="st-chatu8-section-toggle"><i class="fa-solid fa-chevron-down st-chatu8-section-toggle-icon"></i></span>
        </div>
        <div class="st-chatu8-section-body">
        <div class="st-chatu8-field">
            <label for="cache">需要清除的缓存</label>
            <select id="cache" class="st-chatu8-select">
                <option value="0">不再缓存</option>
                <option value="1">点击清除一天前的</option>
                <option value="7">点击清除一星期前的</option>
                <option value="30">点击清除一个月前的</option>
                <option value="365">点击清除一年前的</option>
            </select>
        </div>
        <div class="st-chatu8-field">
            <label for="jiuguanchucun">缓存图片到酒馆</label>
            <div class="st-chatu8-toggle">
                <input id="jiuguanchucun" type="checkbox" />
                <span class="st-chatu8-slider"></span>
            </div>
        </div>
        <div class="st-chatu8-field">
            <label for="vibeJiuguanchucun">缓存 Vibe 到酒馆</label>
            <div class="st-chatu8-toggle">
                <input id="vibeJiuguanchucun" type="checkbox" />
                <span class="st-chatu8-slider"></span>
            </div>
        </div>
        <div class="st-chatu8-field">
            <label for="convertToJpegStorage">转JPEG储存节省70%空间(噪点明显增加)</label>
            <div class="st-chatu8-toggle">
                <input id="convertToJpegStorage" type="checkbox" />
                <span class="st-chatu8-slider"></span>
            </div>
        </div>
        <div class="st-chatu8-field">
            <label>操作</label>
            <div>
                <button id="sync-server-images-btn" class="st-chatu8-btn">错误图片清理</button>
                <button id="migrate-vibe-storage-btn" class="st-chatu8-btn">迁移 Vibe 到酒馆</button>
                <button id="Clear-Cache" class="st-chatu8-btn danger">清除图片缓存</button>
                <button id="migrate-database-btn" class="st-chatu8-btn">数据迁移</button>
                <button id="diagnose-config-storage-btn" class="st-chatu8-btn">错误存储清理</button>
            </div>
        </div>
        </div>
    </div>
    <!-- 自定义：插件顶部菜单隐藏（可折叠） -->
    <div class="st-chatu8-settings-section st-chatu8-collapsible-section is-collapsed" data-section-id="main_nav_hide">
        <div class="st-chatu8-section-header">
            <h4 class="st-chatu8-section-title">插件顶部菜单隐藏</h4>
            <span class="st-chatu8-section-toggle"><i class="fa-solid fa-chevron-down st-chatu8-section-toggle-icon"></i></span>
        </div>
        <div class="st-chatu8-section-body">
        <p style="font-size: 12px; color: var(--st-chatu8-text-secondary); margin-top: 4px;">
            勾选后，对应的顶部菜单（侧边栏标签）将被隐藏，让界面更简洁。要恢复显示，取消勾选即可。
        </p>
        <div id="hiddenNavTabsContainer" class="st-chatu8-grid" style="grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));">
            <div class="st-chatu8-field checkbox"><label style="display:flex;align-items:center;gap:6px;cursor:pointer;"><input type="checkbox" class="hidden-nav-tab-checkbox" value="main"> 主要设置</label></div>

            <div class="st-chatu8-field checkbox"><label style="display:flex;align-items:center;gap:6px;cursor:pointer;"><input type="checkbox" class="hidden-nav-tab-checkbox" value="novelai"> NovelAI</label></div>
            <div class="st-chatu8-field checkbox"><label style="display:flex;align-items:center;gap:6px;cursor:pointer;"><input type="checkbox" class="hidden-nav-tab-checkbox" value="comfyui"> ComfyUI</label></div>
            <div class="st-chatu8-field checkbox"><label style="display:flex;align-items:center;gap:6px;cursor:pointer;"><input type="checkbox" class="hidden-nav-tab-checkbox" value="comfyui_video"> ComfyUI视频</label></div>
            <div class="st-chatu8-field checkbox"><label style="display:flex;align-items:center;gap:6px;cursor:pointer;"><input type="checkbox" class="hidden-nav-tab-checkbox" value="runninghub"> RunningHub</label></div>
            <div class="st-chatu8-field checkbox"><label style="display:flex;align-items:center;gap:6px;cursor:pointer;"><input type="checkbox" class="hidden-nav-tab-checkbox" value="runninghub_video"> RunningHub视频</label></div>
            <div class="st-chatu8-field checkbox"><label style="display:flex;align-items:center;gap:6px;cursor:pointer;"><input type="checkbox" class="hidden-nav-tab-checkbox" value="video_assets"> 视频资产</label></div>

            <div class="st-chatu8-field checkbox"><label style="display:flex;align-items:center;gap:6px;cursor:pointer;"><input type="checkbox" class="hidden-nav-tab-checkbox" value="llm"> LLM</label></div>
            <div class="st-chatu8-field checkbox"><label style="display:flex;align-items:center;gap:6px;cursor:pointer;"><input type="checkbox" class="hidden-nav-tab-checkbox" value="dna"> 档案库</label></div>
            <div class="st-chatu8-field checkbox"><label style="display:flex;align-items:center;gap:6px;cursor:pointer;"><input type="checkbox" class="hidden-nav-tab-checkbox" value="vocabulary"> 词库</label></div>

        </div>
    </div>
</div>
